# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin.
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1024m

# GitHub OAuth App Client ID used by the OAuth Device Flow.
# Register an OAuth App (https://github.com/settings/developers) with
# "Enable Device Flow" checked and paste its Client ID here,
# or set it later inside the app (Auth screen / Settings > Developer).
GITYOU_CLIENT_ID=

# Base version of the app (single source of truth, read by app/build.gradle.kts).
# CI appends ".<run number>" to the versionName, uses the run number as the
# versionCode and publishes the build as tag v<versionName> — see
# .github/workflows/build.yml.
gityouBaseVersionName=1.2.0
gityouBaseVersionCode=3
