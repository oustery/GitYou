name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Tests + per-ABI APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing (from repo secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gityou-release.jks"
            {
              echo "GITYOU_KEYSTORE_FILE=$RUNNER_TEMP/gityou-release.jks"
              echo "GITYOU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "GITYOU_KEY_ALIAS=$KEY_ALIAS"
              echo "GITYOU_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release signing configured from secrets."
          else
            echo "Signing secrets are absent — release APKs will be unsigned."
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble per-ABI APKs (debug + release)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Summarize artifacts
        if: always()
        run: |
          echo "### Built APKs (one file per ABI)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: GitYou-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: GitYou-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
